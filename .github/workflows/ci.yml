name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  resolve-vendor:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Recreate locked vendor files from GitHub
        shell: bash
        run: |
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
              Path(entry['destination']).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json

  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      # README round-trip and fixture benchmarks consume these as test inputs.
      force_heavy_paths: |-
        README.md
        fixtures

  pytest:
    permissions:
      contents: read
    needs: [changes, resolve-vendor]
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep failure-identity expected-reports aligned with this matrix.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test deps
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python-version }}"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Verify enrolled GHI is stdlib-loadable
        run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('vendored_ghi','vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --group dev --python "$(python -c 'import sys; print(sys.executable)')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install JS mirror readers (no browser)
        run: npm ci --prefix tests/mirror --no-audit --no-fund
      - name: Fetch pinned xprobe JUnit importer
        env:
          XPROBE_COMMIT: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
          XPROBE_BLOB: dbc5b7d55005d6288c072a7612584d6170c216f4
        run: |
          set -euo pipefail
          mkdir -p build/shared
          rm -f build/shared/xprobe.py
          curl -fsSLo build/shared/xprobe.py.tmp "https://raw.githubusercontent.com/myon-bioinformatics/xprobe/$XPROBE_COMMIT/xprobe.py"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          data = Path("build/shared/xprobe.py.tmp").read_bytes()
          actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if actual != os.environ["XPROBE_BLOB"]:
              raise SystemExit("Importer verification failed")
          PY
          mv build/shared/xprobe.py.tmp build/shared/xprobe.py
      - name: Run pytest
        env:
          PYTHONPATH: build/shared
          FAILURE_EVIDENCE_DIR: build/controlled-failure
          # toml_to_markdown's Node fallback (smol-toml) on Python 3.9/3.10.
          NODE_PATH: ${{ github.workspace }}/tests/mirror/node_modules
        run: uv run pytest -q --junitxml=build/junit/pytest-${{ matrix.python-version }}.xml
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: build/junit/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 14

      - name: Preserve controlled child evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controlled-failure-py${{ matrix.python-version }}
          path: build/controlled-failure/
          if-no-files-found: error
          retention-days: 14

  node-runtime:
    permissions:
      contents: read
    needs: [changes, resolve-vendor]
    if: needs.changes.outputs.product_changed == 'true'
    name: node TOML bridge (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['26', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Verify enrolled GHI is stdlib-loadable
        run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('vendored_ghi','vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --group dev --python "$(python -c 'import sys; print(sys.executable)')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Prepare and install pinned TOML-only dependency
        shell: bash
        run: |
          python -S - <<'PYTHON'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          import urllib.request
          
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          work = Path(tempfile.mkdtemp(prefix="nano-toml-ci-", dir=os.environ["RUNNER_TEMP"]))
          helper = work / "nano_node.py"
          url = "https://raw.githubusercontent.com/myon-bioinformatics/myon-bioinformatics/dd2f4dcf64cfc8246003c4423e40a19ae88e86e1/tools/nano_node.py"
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read(256 * 1024 + 1)
          if len(data) > 256 * 1024 or hashlib.sha256(data).hexdigest() != "9aa7e8a6bd99e385f3157490b8e91aa50e4c781b5eb23f449aaad5fa9f6d06dc":
              raise RuntimeError("pinned nano helper hash mismatch")
          helper.write_bytes(data)
          spec = importlib.util.spec_from_file_location("nano_ci", helper)
          nano = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(nano)
          # Git's Windows checkout may convert LF to CRLF. Preserve the strict helper:
          # stage the two current HEAD blobs, accepting only that exact checkout transform.
          inputs = work / "inputs"
          inputs.mkdir()
          head = subprocess.run(["git", "rev-parse", "--verify", "HEAD"], cwd=workspace,
                                capture_output=True, check=True, timeout=30).stdout.strip().decode("ascii")
          if len(head) != 40 or any(c not in "0123456789abcdef" for c in head):
              raise RuntimeError("expected the current checkout's full Git commit")
          for filename in ("package.json", "package-lock.json"):
              relative = "tests/mirror/" + filename
              path = workspace / relative
              if path.is_symlink() or not path.is_file():
                  raise RuntimeError("expected regular checkout package input")
              committed = subprocess.run(["git", "--no-pager", "show", head + ":" + relative],
                                         cwd=workspace, capture_output=True, check=True, timeout=30).stdout
              if path.read_bytes() not in (committed, committed.replace(b"\n", b"\r\n")):
                  raise RuntimeError("checkout package input differs from HEAD beyond CRLF conversion")
              (inputs / filename).write_bytes(committed)
          if subprocess.run(["git", "rev-parse", "--verify", "HEAD"], cwd=workspace,
                            capture_output=True, check=True, timeout=30).stdout.strip().decode("ascii") != head:
              raise RuntimeError("checkout HEAD changed during input staging")
          print("Preparing package inputs from current checkout HEAD:", head)
          prepared = nano.prepare(inputs, work / "prepared",
                                  feature="markdown-toml", dependencies_only=True)
          receipt = json.loads((prepared / "receipt.json").read_bytes())
          if (receipt.get("dependencies_only") is not True
                  or receipt.get("application_source_staged") is not False
                  or receipt.get("candidate_locked_package_records") != 1):
              raise RuntimeError("unexpected dependency-only receipt")
          project = prepared / "markdown-toml"
          for filename, digest in (("package.json", receipt["projected_manifest_sha256"]),
                                   ("package-lock.json", receipt["projected_lock_sha256"])):
              if hashlib.sha256((project / filename).read_bytes()).hexdigest() != digest:
                  raise RuntimeError("projected input changed before install")
          env = {k: v for k, v in os.environ.items() if not k.lower().startswith("npm_config_")
                 and k not in ("NODE_OPTIONS", "NODE_PATH", "NODE_ENV")}
          env.update(HOME=str(prepared / "home"), XDG_CONFIG_HOME=str(prepared / "config"))
          npm = shutil.which("npm")
          if not npm:
              raise RuntimeError("npm not found")
          subprocess.run([npm, "ci", "--ignore-scripts", "--include=dev", "--no-audit", "--no-fund",
                          "--registry=https://registry.npmjs.org", "--userconfig", str(prepared / "user.npmrc"),
                          "--globalconfig", str(prepared / "global.npmrc"), "--cache", str(prepared / "cache")],
                         cwd=project, env=env, check=True, timeout=180)
          installed = project / "node_modules"
          locked = json.loads((installed / ".package-lock.json").read_bytes())
          if set(locked.get("packages", {})) != {"node_modules/smol-toml"}:
              raise RuntimeError("unexpected installed TOML package set")
          if json.loads((installed / "smol-toml/package.json").read_bytes())["version"] != "1.9.1":
              raise RuntimeError("required pinned smol-toml is missing or changed")
          # Copy only dependencies; application/tests/config remain the live checkout.
          # A copy works on Windows without requiring symlink privileges.
          target = workspace / "tests/mirror/node_modules"
          if target.exists() or target.is_symlink():
              raise RuntimeError("refusing to overwrite an existing test dependency directory")
          shutil.copytree(installed, target)
          print("TOML job: 32 original lock records -> 1 installed package; live tests unchanged")
          PYTHON
      - name: Run Node-backed pytest slice
        env:
          NODE_PATH: ${{ github.workspace }}/tests/mirror/node_modules
        run: uv run pytest -q tests/test_toml_node_fallback.py --junitxml=build/junit/node-${{ matrix.os }}-${{ matrix.node }}.xml
      - name: Require the complete non-skipped TOML slice
        shell: bash
        env:
          TOML_JUNIT: build/junit/node-${{ matrix.os }}-${{ matrix.node }}.xml
        run: |
          python -S - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          cases = ET.parse(os.environ["TOML_JUNIT"]).getroot().findall(".//testcase")
          if len(cases) < 15 or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("expected all 15 or more TOML tests with zero skips")
          PYTHON
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-node-${{ matrix.os }}-${{ matrix.node }}
          path: build/junit/node-${{ matrix.os }}-${{ matrix.node }}.xml
          if-no-files-found: error
          retention-days: 14

  frontend-mock-pytest-latest:
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
      GRADIO_SHARE: "False"
      GRADIO_ROOT_PATH: ""
      GRADIO_SSR_MODE: "False"
      GRADIO_VIBE_MODE: ""
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Sync locked frontend test environment
        shell: bash
        run: |
          uv sync --locked --group dev --group frontend --python "$(python -c 'import sys; print(sys.executable)')"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv run --no-sync pytest --version
      - name: Require the combined frontend environment
        run: |
          .venv/bin/python - <<'PYTHON'
          import importlib.util
          import shutil
          for framework in ("gradio", "streamlit", "playwright"):
              assert importlib.util.find_spec(framework) is not None
          assert shutil.which("curl"), "curl is required; do not silently skip HTTP tests"
          PYTHON
      - name: Run all existing browser-free wiring tests together
        run: |
          uv run --no-sync pytest -q \
            tests/frontend/test_gradio_curl.py \
            tests/frontend/test_gradio_ui.py \
            tests/frontend/test_streamlit_curl.py \
            tests/frontend/test_streamlit_ui.py \
            --junitxml=build/junit/frontend-all.xml
      - name: Require all seven tests with zero skips
        run: python -S scripts/check_frontend_slice.py all build/junit/frontend-all.xml
      - name: Preserve frontend JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-junit-all
          path: build/junit/frontend-all.xml
          if-no-files-found: error
          retention-days: 14

  frontend-smoke:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Sync locked frontend test environment
        shell: bash
        run: |
          uv sync --locked --group dev --group frontend --python "$(python -c 'import sys; print(sys.executable)')"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv run pytest --version
      - name: Import demo modules
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('demos/gradio_app.py').read_text())"
          python -c "import ast, pathlib; ast.parse(pathlib.Path('demos/streamlit_app.py').read_text())"
      - name: Install Playwright's Chromium
        run: playwright install --with-deps --only-shell chromium
      - name: Run Gradio/Streamlit/chat UI frontend tests
        run: uv run pytest -q tests/frontend

  failure-identity:
    needs: [changes, pytest, node-runtime]
    if: always() && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-py3.11/pytest-3.11.xml","junit-py3.12/pytest-3.12.xml","junit-py3.13/pytest-3.13.xml","junit-py3.14/pytest-3.14.xml","junit-node-ubuntu-latest-26/node-ubuntu-latest-26.xml","junit-node-ubuntu-latest-latest/node-ubuntu-latest-latest.xml","junit-node-windows-latest-26/node-windows-latest-26.xml","junit-node-windows-latest-latest/node-windows-latest-latest.xml","junit-node-macos-latest-26/node-macos-latest-26.xml","junit-node-macos-latest-latest/node-macos-latest-latest.xml"]'
      artifact-pattern: "junit-*"
      output-artifact: "failure-identity"

  test-locked:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install test deps
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "latest"
        python-version: "${{ matrix.python-version }}"
        activate-environment: true
        enable-cache: true
        # Pull requests restore the cache and never write it; only main saves it.
        save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        prune-cache: true
    - name: Fetch pinned shared vendor tool
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: myon-bioinformatics/myon-bioinformatics
        path: .vendor-sync-tools
        ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
        persist-credentials: false
    - name: Verify checked-in vendor copies
      run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Recreate locked vendor files from GitHub
      shell: bash
      run: |
        python -S - <<'PY'
        import json
        from pathlib import Path
        for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
            Path(entry['destination']).unlink()
        PY
        python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
        python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Verify enrolled GHI is stdlib-loadable
      run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('vendored_ghi','vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
    - name: Sync locked development environment
      shell: bash
      run: |
        uv sync --locked --group dev --python "$(python -c 'import sys; print(sys.executable)')"
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
        else
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        fi
    - name: Fetch pinned xprobe JUnit importer
      env:
        XPROBE_COMMIT: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
        XPROBE_BLOB: dbc5b7d55005d6288c072a7612584d6170c216f4
      run: |
        set -euo pipefail
        mkdir -p build/shared
        rm -f build/shared/xprobe.py
        curl -fsSLo build/shared/xprobe.py.tmp "https://raw.githubusercontent.com/myon-bioinformatics/xprobe/$XPROBE_COMMIT/xprobe.py"
        python - <<'PY'
        import hashlib
        import os
        from pathlib import Path
        data = Path("build/shared/xprobe.py.tmp").read_bytes()
        actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
        if actual != os.environ["XPROBE_BLOB"]:
            raise SystemExit("Importer verification failed")
        PY
        mv build/shared/xprobe.py.tmp build/shared/xprobe.py
    - name: Run pytest
      env:
        PYTHONPATH: build/shared
        FAILURE_EVIDENCE_DIR: build/controlled-failure
      run: uv run pytest -q --junitxml=build/junit/pytest-${{ matrix.python-version }}.xml
    - name: Preserve raw JUnit
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: locked-junit-py${{ matrix.python-version }}
        path: build/junit/pytest-${{ matrix.python-version }}.xml
        if-no-files-found: error
        retention-days: 14
    - name: Preserve controlled child evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: locked-controlled-failure-py${{ matrix.python-version }}
        path: build/controlled-failure/
        if-no-files-found: error
        retention-days: 14
    name: Locked baseline
    timeout-minutes: 20
