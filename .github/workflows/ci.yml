name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@main

  pytest:
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -q


  module-metadata:
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Summarize markdown.py metadata
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from datetime import datetime
          import os
          import re
          from pathlib import Path

          path = Path("markdown.py")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          metadata_lines = [line for line in lines if line.startswith("# metadata:")]
          if len(lines) < 2 or len(metadata_lines) != 1 or lines[1] != metadata_lines[0]:
              raise SystemExit(
                  "markdown.py metadata header must appear exactly once on line 2"
              )

          match = re.fullmatch(
              r"# metadata: __all__=(\\d+) \\| base_sha=((?:[0-9a-f]{40}|[0-9a-f]{64})) "
              r"\\| updated_at=([^\\s]+)",
              lines[1],
          )
          if not match:
              raise SystemExit("markdown.py metadata header is malformed")

          declared_count = int(match.group(1))
          base_sha = match.group(2)
          updated_at = match.group(3)
          parsed_updated_at = datetime.fromisoformat(updated_at.replace("Z", "+00:00"))
          if parsed_updated_at.tzinfo is None:
              raise SystemExit("markdown.py metadata updated_at must include timezone")

          tree = ast.parse(text)
          all_bindings = [
              node
              for node in tree.body
              if (
                  isinstance(node, ast.Assign)
                  and any(
                      isinstance(target, ast.Name) and target.id == "__all__"
                      for target in node.targets
                  )
              )
              or (
                  isinstance(node, (ast.AnnAssign, ast.AugAssign))
                  and isinstance(node.target, ast.Name)
                  and node.target.id == "__all__"
              )
          ]
          if len(all_bindings) != 1 or not isinstance(all_bindings[0], ast.Assign):
              raise SystemExit("markdown.py must define __all__ exactly once")

          value = all_bindings[0].value
          if not isinstance(value, (ast.List, ast.Tuple)) or not all(
              isinstance(item, ast.Constant) and isinstance(item.value, str)
              for item in value.elts
          ):
              raise SystemExit("markdown.py __all__ must be a literal list or tuple of strings")
          actual_count = len(value.elts)
          actual_display = str(actual_count)
          if actual_count != declared_count:
              raise SystemExit(
                  f"metadata __all__={declared_count} "
                  f"but actual __all__ has {actual_count} entries"
              )

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## markdown.py metadata\n\n")
                  fh.write("| field | value |\n|---|---|\n")
                  fh.write(f"| declared __all__ | {declared_count} |\n")
                  fh.write(f"| actual __all__ | {actual_display} |\n")
                  fh.write(f"| base SHA | `{base_sha}` |\n")
                  fh.write(f"| updated at (UTC) | `{updated_at}` |\n")
          PY

  frontend-mock-pytest-latest:
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install latest-pytest frontend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.1.1"
          python -m pip install -r requirements-frontend.txt
          pytest --version
      - name: Run headless frontend mock tests on pytest 9.1.1
        run: |
          pytest -q \
            tests/frontend/test_gradio_curl.py \
            tests/frontend/test_gradio_ui.py \
            tests/frontend/test_streamlit_curl.py \
            tests/frontend/test_streamlit_ui.py

  frontend-smoke:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install frontend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.1.1"
          python -m pip install -r requirements-frontend.txt
          pytest --version
      - name: Import demo modules
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('demos/gradio_app.py').read_text())"
          python -c "import ast, pathlib; ast.parse(pathlib.Path('demos/streamlit_app.py').read_text())"
      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium
      - name: Run Gradio/Streamlit/chat UI frontend tests
        run: pytest -q tests/frontend
