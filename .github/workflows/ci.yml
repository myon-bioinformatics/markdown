name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -q


  module-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Summarize markdown.py metadata
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          from pathlib import Path

          path = Path("markdown.py")
          text = path.read_text(encoding="utf-8")
          match = re.search(
              r"^# metadata: __all__=(\d+) \| base_sha=([0-9a-f]{40}) "
              r"\| updated_at=([^\s]+)$",
              text,
              re.MULTILINE,
          )
          if not match:
              print("::warning::markdown.py metadata header is missing or malformed")
              raise SystemExit(0)

          declared_count = int(match.group(1))
          base_sha = match.group(2)
          updated_at = match.group(3)

          tree = ast.parse(text)
          actual_count = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  if any(isinstance(target, ast.Name) and target.id == "__all__" for target in node.targets):
                      if isinstance(node.value, (ast.List, ast.Tuple)):
                          actual_count = len(node.value.elts)
                      break

          if actual_count is None:
              print("::warning::Could not determine __all__ count")
              actual_display = "unknown"
          else:
              actual_display = str(actual_count)
              if actual_count != declared_count:
                  print(
                      f"::warning::metadata __all__={declared_count} "
                      f"but actual __all__ has {actual_count} entries"
                  )

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## markdown.py metadata\n\n")
                  fh.write("| field | value |\n|---|---|\n")
                  fh.write(f"| declared __all__ | {declared_count} |\n")
                  fh.write(f"| actual __all__ | {actual_display} |\n")
                  fh.write(f"| base SHA | `{base_sha}` |\n")
                  fh.write(f"| updated at (UTC) | `{updated_at}` |\n")
          PY

  frontend-mock-pytest-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install latest-pytest frontend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.1.1"
          python -m pip install -r requirements-frontend.txt
          pytest --version
      - name: Run headless frontend mock tests on pytest 9.1.1
        run: |
          pytest -q \
            tests/frontend/test_gradio_curl.py \
            tests/frontend/test_gradio_ui.py \
            tests/frontend/test_streamlit_curl.py \
            tests/frontend/test_streamlit_ui.py

  frontend-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install frontend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.1.1"
          python -m pip install -r requirements-frontend.txt
          pytest --version
      - name: Import demo modules
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('demos/gradio_app.py').read_text())"
          python -c "import ast, pathlib; ast.parse(pathlib.Path('demos/streamlit_app.py').read_text())"
      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium
      - name: Run Gradio/Streamlit/chat UI frontend tests
        run: pytest -q tests/frontend
