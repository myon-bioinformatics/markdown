name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@76a9e43fe7469d0e3a5728e0521bc5738afad725
    with:
      # README round-trip and fixture benchmarks consume these as test inputs.
      force_heavy_paths: |-
        README.md
        fixtures

  pytest:
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep failure-identity expected-reports aligned with this matrix.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -q --junitxml=build/junit/pytest-${{ matrix.python-version }}.xml
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: build/junit/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 14


  module-metadata:
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and summarize markdown.py provenance
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path

          artifact = Path("markdown.py")
          validator_path = Path("vendor/python_artifact_provenance.py")
          provenance_path = Path("vendor/python_artifact_provenance.provenance.json")

          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          data = validator_path.read_bytes()
          if hashlib.sha256(data).hexdigest() != provenance["sha256"]:
              raise SystemExit("vendored provenance validator sha256 mismatch")
          git_blob = b"blob " + str(len(data)).encode("ascii") + bytes([0]) + data
          if hashlib.sha1(git_blob).hexdigest() != provenance["blob_sha"]:
              raise SystemExit("vendored provenance validator git blob mismatch")

          spec = importlib.util.spec_from_file_location(
              "vendored_python_artifact_provenance",
              validator_path,
          )
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load vendored provenance validator")
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)

          metadata = validator.validate_source_header(
              artifact.read_text(encoding="utf-8")
          )
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## markdown.py metadata\n\n")
                  fh.write("| field | value |\n|---|---|\n")
                  fh.write(f"| declared/actual __all__ | {metadata['all_count']} |\n")
                  fh.write(f"| base SHA | `{metadata['base_sha']}` |\n")
                  fh.write(f"| updated at (UTC) | `{metadata['updated_at']}` |\n")
          PY

  frontend-mock-pytest-latest:
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install latest-pytest frontend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pytest
          python -m pip install -r requirements-frontend.txt
          pytest --version
      - name: Run headless frontend mock tests on pytest 9.1.1
        run: |
          pytest -q \
            tests/frontend/test_gradio_curl.py \
            tests/frontend/test_gradio_ui.py \
            tests/frontend/test_streamlit_curl.py \
            tests/frontend/test_streamlit_ui.py

  frontend-smoke:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install frontend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pytest
          python -m pip install -r requirements-frontend.txt
          pytest --version
      - name: Import demo modules
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('demos/gradio_app.py').read_text())"
          python -c "import ast, pathlib; ast.parse(pathlib.Path('demos/streamlit_app.py').read_text())"
      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium
      - name: Run Gradio/Streamlit/chat UI frontend tests
        run: pytest -q tests/frontend

  failure-identity:
    needs: [changes, pytest]
    if: always() && needs.changes.outputs.non_docs_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@4dfda95d6573250477f991a0421fa6acb9bc0258
    with:
      expected-reports: '["junit-py3.9/pytest-3.9.xml","junit-py3.10/pytest-3.10.xml","junit-py3.11/pytest-3.11.xml","junit-py3.12/pytest-3.12.xml","junit-py3.13/pytest-3.13.xml","junit-py3.14/pytest-3.14.xml"]'
      artifact-pattern: "junit-py*"
      output-artifact: "failure-identity"
