name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  resolve-vendor:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Recreate locked vendor files from GitHub
        shell: bash
        run: |
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
              Path(entry['destination']).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json

  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      # README round-trip and fixture benchmarks consume these as test inputs.
      force_heavy_paths: |-
        README.md
        fixtures

  pytest:
    permissions:
      contents: read
    needs: [changes, resolve-vendor]
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep failure-identity expected-reports aligned with this matrix.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test deps
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python-version }}"
          activate-environment: true
          enable-cache: false
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Verify enrolled GHI is stdlib-loadable
        run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('vendored_ghi','vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --group dev --python "$(python -c 'import sys; print(sys.executable)')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install JS mirror readers (no browser)
        run: npm ci --prefix tests/mirror --no-audit --no-fund
      - name: Fetch pinned xprobe JUnit importer
        env:
          XPROBE_COMMIT: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
          XPROBE_BLOB: dbc5b7d55005d6288c072a7612584d6170c216f4
        run: |
          set -euo pipefail
          mkdir -p build/shared
          rm -f build/shared/xprobe.py
          curl -fsSLo build/shared/xprobe.py.tmp "https://raw.githubusercontent.com/myon-bioinformatics/xprobe/$XPROBE_COMMIT/xprobe.py"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          data = Path("build/shared/xprobe.py.tmp").read_bytes()
          actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if actual != os.environ["XPROBE_BLOB"]:
              raise SystemExit("Importer verification failed")
          PY
          mv build/shared/xprobe.py.tmp build/shared/xprobe.py
      - name: Run pytest
        env:
          PYTHONPATH: build/shared
          MARKDOWN_FAILURE_EVIDENCE: build/controlled-failure
          # toml_to_markdown's Node fallback (smol-toml) on Python 3.9/3.10.
          NODE_PATH: ${{ github.workspace }}/tests/mirror/node_modules
        run: uv run pytest -q --junitxml=build/junit/pytest-${{ matrix.python-version }}.xml
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: build/junit/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 14

      - name: Preserve controlled child evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controlled-failure-py${{ matrix.python-version }}
          path: build/controlled-failure/
          if-no-files-found: error
          retention-days: 14

  node-runtime:
    permissions:
      contents: read
    needs: [changes, resolve-vendor]
    if: needs.changes.outputs.product_changed == 'true'
    name: node TOML bridge (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Verify enrolled GHI is stdlib-loadable
        run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('vendored_ghi','vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --group dev --python "$(python -c 'import sys; print(sys.executable)')"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install JS mirror readers (no browser)
        run: npm ci --prefix tests/mirror --no-audit --no-fund
      - name: Run Node-backed pytest slice
        env:
          NODE_PATH: ${{ github.workspace }}/tests/mirror/node_modules
        run: uv run pytest -q tests/test_toml_node_fallback.py --junitxml=build/junit/node-${{ matrix.os }}-${{ matrix.node }}.xml
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-node-${{ matrix.os }}-${{ matrix.node }}
          path: build/junit/node-${{ matrix.os }}-${{ matrix.node }}.xml
          if-no-files-found: error
          retention-days: 14

  frontend-mock-pytest-latest:
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Sync locked frontend test environment
        shell: bash
        run: |
          uv sync --locked --group dev --group frontend --python "$(python -c 'import sys; print(sys.executable)')"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv run pytest --version
      - name: Run headless frontend mock tests on locked pytest
        run: |
          uv run pytest -q \
            tests/frontend/test_gradio_curl.py \
            tests/frontend/test_gradio_ui.py \
            tests/frontend/test_streamlit_curl.py \
            tests/frontend/test_streamlit_ui.py

  frontend-smoke:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Sync locked frontend test environment
        shell: bash
        run: |
          uv sync --locked --group dev --group frontend --python "$(python -c 'import sys; print(sys.executable)')"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv run pytest --version
      - name: Import demo modules
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('demos/gradio_app.py').read_text())"
          python -c "import ast, pathlib; ast.parse(pathlib.Path('demos/streamlit_app.py').read_text())"
      - name: Install Playwright's Chromium
        run: playwright install --with-deps --only-shell chromium
      - name: Run Gradio/Streamlit/chat UI frontend tests
        run: uv run pytest -q tests/frontend

  failure-identity:
    needs: [changes, pytest, node-runtime]
    if: always() && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-py3.11/pytest-3.11.xml","junit-py3.12/pytest-3.12.xml","junit-py3.13/pytest-3.13.xml","junit-py3.14/pytest-3.14.xml","junit-node-ubuntu-latest-24/node-ubuntu-latest-24.xml","junit-node-ubuntu-latest-latest/node-ubuntu-latest-latest.xml","junit-node-windows-latest-24/node-windows-latest-24.xml","junit-node-windows-latest-latest/node-windows-latest-latest.xml","junit-node-macos-latest-24/node-macos-latest-24.xml","junit-node-macos-latest-latest/node-macos-latest-latest.xml"]'
      artifact-pattern: "junit-*"
      output-artifact: "failure-identity"

  test-locked:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install test deps
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "latest"
        python-version: "${{ matrix.python-version }}"
        activate-environment: true
        enable-cache: false
    - name: Fetch pinned shared vendor tool
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: myon-bioinformatics/myon-bioinformatics
        path: .vendor-sync-tools
        ref: 9e3da7ae1846e9604ebc24bb5178f7de094a4e77
        persist-credentials: false
    - name: Verify checked-in vendor copies
      run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Recreate locked vendor files from GitHub
      shell: bash
      run: |
        python -S - <<'PY'
        import json
        from pathlib import Path
        for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
            Path(entry['destination']).unlink()
        PY
        python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
        python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Verify enrolled GHI is stdlib-loadable
      run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('vendored_ghi','vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
    - name: Sync locked development environment
      shell: bash
      run: |
        uv sync --locked --group dev --python "$(python -c 'import sys; print(sys.executable)')"
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
        else
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        fi
    - name: Fetch pinned xprobe JUnit importer
      env:
        XPROBE_COMMIT: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
        XPROBE_BLOB: dbc5b7d55005d6288c072a7612584d6170c216f4
      run: |
        set -euo pipefail
        mkdir -p build/shared
        rm -f build/shared/xprobe.py
        curl -fsSLo build/shared/xprobe.py.tmp "https://raw.githubusercontent.com/myon-bioinformatics/xprobe/$XPROBE_COMMIT/xprobe.py"
        python - <<'PY'
        import hashlib
        import os
        from pathlib import Path
        data = Path("build/shared/xprobe.py.tmp").read_bytes()
        actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
        if actual != os.environ["XPROBE_BLOB"]:
            raise SystemExit("Importer verification failed")
        PY
        mv build/shared/xprobe.py.tmp build/shared/xprobe.py
    - name: Run pytest
      env:
        PYTHONPATH: build/shared
        MARKDOWN_FAILURE_EVIDENCE: build/controlled-failure
      run: uv run pytest -q --junitxml=build/junit/pytest-${{ matrix.python-version }}.xml
    - name: Preserve raw JUnit
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: locked-junit-py${{ matrix.python-version }}
        path: build/junit/pytest-${{ matrix.python-version }}.xml
        if-no-files-found: error
        retention-days: 14
    - name: Preserve controlled child evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: locked-controlled-failure-py${{ matrix.python-version }}
        path: build/controlled-failure/
        if-no-files-found: error
        retention-days: 14
    name: Locked baseline
    timeout-minutes: 20
