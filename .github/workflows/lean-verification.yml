name: Lean verification

on:
  pull_request:
    paths:
      - "formal/**"
      - "markdown.py"
      - "tests/test_formal_bridge.py"
      - ".github/workflows/lean-verification.yml"
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "markdown.py"
      - "tests/test_formal_bridge.py"
      - ".github/workflows/lean-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fence-roundtrip:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-lean-verify.yml@27dedd9651efc816fa88d8922adb5f242725df69
    with:
      project-directory: formal
      proof: FenceRoundtrip.lean
      theorems: |
        MarkdownFence.prefix_run_replicate_append
        MarkdownFence.fence_prefix_iff
        MarkdownFence.prefix_run_le_longest
        MarkdownFence.line_run_le_body_bound
        MarkdownFence.adaptive_fence_separates_body
        MarkdownFence.read_body_append_close
        MarkdownFence.adaptive_roundtrip
