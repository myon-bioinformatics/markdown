name: Pages

# Publishes the usage guide: docs/guide.page.json (a web-ui-page/1 spec, data only, with 🎞 GIF demo / 🧩 features
# tabs) and the repository diagnostics (scripts/markdown_repository_diagnostics.py). The parent's reusable workflow
# renders both with the PySaiyanWeBoo commit pinned there. Pull requests build the site (an invalid spec fails there);
# only main deploys.
#
# The real-world benchmark is summarised in the README (construct counts and a link to the original page).
# scripts/real_world_pages_report.py stays a local, best-effort report: the vendored page is for parser benchmarks
# only, not redistribution, so neither its HTML nor its screenshots are published.
on:
  push:
    branches: [main]
    paths:
      - "docs/guide.page.json"
      - "docs/brand/**"
      - "docs/evidence/browser.gif"
      - "scripts/markdown_repository_diagnostics.py"
      - "vendor/gh_identity.py"
      - "vendor/github_public_resolver.py"
      - "vendor.lock.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/guide.page.json"
      - "docs/brand/**"
      - "docs/evidence/browser.gif"
      - "scripts/markdown_repository_diagnostics.py"
      - "vendor/gh_identity.py"
      - "vendor/github_public_resolver.py"
      - "vendor.lock.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@main
    with:
      artifact_path: _site
      guide_page: docs/guide.page.json
      guide_assets: docs/evidence/browser.gif=demos/browser.gif
      guide_brand: markdown   # ♻️ icon and favicon from CaChereCyCle (markdown.icon / markdown.favicon)
      build: uv run --locked --only-group dev python scripts/markdown_repository_diagnostics.py _site   # 📦 this repository's own PSWB pin (pyproject.toml)
