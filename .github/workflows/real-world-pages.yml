name: real-world-pages

# Publishes scripts/real_world_pages_report.py's output to GitHub Pages:
# for every real, vendored HTML fixture in fixtures/provenance.yaml (see
# tests/test_benchmark_html_roundtrip.py), a screenshot of the original
# next to a screenshot of the html_to_markdown() -> markdown_to_html()
# round trip, plus a before/after construct-count table and a
# build_meta.json revision identity (sha / shortSha / commitUrl) sourced
# from git and GITHUB_* Actions env — same idea as
# flutter_navigation_basic's `dart run tool/dev.dart meta`, in Python.
#
# Runs entirely against the vendored fixture -- no live fetch of the real
# site happens here, so this never flakes on that site being slow, down,
# or changed since the fixture was last refreshed (same bet every other
# benchmark fixture in this repo already makes).
#
# Runs on pull requests that change the report/diagnostics inputs and on
# main pushes for deployment. The benchmark fixture path itself stays offline
# and reproducible, while repository diagnostics may perform anonymous public
# GitHub URL observations. deploy is main-only, so a feature branch's report
# never overwrites the published Pages site.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/real_world_pages_report.py"
      - "scripts/check_report_screenshots.py"
      - "tests/test_report_screenshot_evidence.py"
      - "markdown.py"
      - "scripts/repository_diagnostics.py"
      - "vendor/repository_metadata_contract.py"
      - "vendor/repository_metadata_contract.provenance.json"
      - "vendor/repository_metadata_generator.py"
      - "vendor/repository_metadata_generator.provenance.json"
      - "tests/test_repository_metadata_producer.py"
      - "vendor/github_public_resolver.py"
      - "vendor/github_public_resolver.provenance.json"
      - "tests/test_repository_diagnostics.py"
      - "fixtures/benchmark/**"
      - "fixtures/provenance.yaml"
      - ".github/workflows/real-world-pages.yml"
  push:
    branches: [main]
    paths:
      - "scripts/real_world_pages_report.py"
      - "scripts/check_report_screenshots.py"
      - "tests/test_report_screenshot_evidence.py"
      - "markdown.py"
      - "scripts/repository_diagnostics.py"
      - "vendor/repository_metadata_contract.py"
      - "vendor/repository_metadata_contract.provenance.json"
      - "vendor/repository_metadata_generator.py"
      - "vendor/repository_metadata_generator.provenance.json"
      - "tests/test_repository_metadata_producer.py"
      - "vendor/github_public_resolver.py"
      - "vendor/github_public_resolver.provenance.json"
      - "fixtures/benchmark/**"
      - "fixtures/provenance.yaml"
      - ".github/workflows/real-world-pages.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The canonical producer reads HEAD, so check out the PR head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check out pinned browser-test-kit validators
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/browser-test-kit
          ref: 6a2e32a4bbe49be5268e6b30040d665a89eecf66
          path: .browser-test-kit
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install pyyaml playwright==1.58.0 pytest
          playwright install --with-deps chromium
      - name: Test fixture-to-image requirements
        env:
          BROWSER_TEST_KIT: .browser-test-kit
        run: python -m pytest -q tests/test_report_screenshot_evidence.py
      - name: Clear prior report evidence
        run: rm -rf _site
      - name: Build the report
        id: capture
        run: |
          python scripts/real_world_pages_report.py --out _site
          python scripts/repository_diagnostics.py _site
      - name: Require fixture receipts and prove corruption rejection
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CAPTURE_STAGE: ${{ steps.capture.outcome == 'success' && 'complete' || 'failed' }}
        run: |
          python scripts/check_report_screenshots.py _site --kit .browser-test-kit \
            --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --stage "$CAPTURE_STAGE"
      - name: Preserve available screenshot evidence after success or failure
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-world-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: _site
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize measured screenshot coverage
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Real-world screenshot evidence: $JOB_STATUS"
            echo "Required: each HTML fixture's original/roundtrip PNG, Chromium only."
            echo "Shared PNG/hash/run receipt validation and four real-bundle rejection probes; no pixel/content assertion."
            echo "Firefox/WebKit/mobile unmeasured. Failed bundles do not prove success."
            echo "Evidence (14 days): $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
