name: real-world-pages

# Publishes scripts/real_world_pages_report.py's output to GitHub Pages:
# for every real, vendored HTML fixture in fixtures/provenance.yaml (see
# tests/test_benchmark_html_roundtrip.py), a screenshot of the original
# next to a screenshot of the html_to_markdown() -> markdown_to_html()
# round trip, plus a before/after construct-count table and a
# build_meta.json revision identity (sha / shortSha / commitUrl) sourced
# from git and GITHUB_* Actions env — same idea as
# flutter_navigation_basic's `dart run tool/dev.dart meta`, in Python.
#
# Runs entirely against the vendored fixture -- no live fetch of the real
# site happens here, so this never flakes on that site being slow, down,
# or changed since the fixture was last refreshed (same bet every other
# benchmark fixture in this repo already makes).
#
# Runs on pull requests that change the report/diagnostics inputs and on
# main pushes for deployment. The benchmark fixture path itself stays offline
# and reproducible, while repository diagnostics may perform anonymous public
# GitHub URL observations. deploy is main-only, so a feature branch's report
# never overwrites the published Pages site.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/real_world_pages_report.py"
      - "scripts/repository_diagnostics.py"
      - "vendor/repository_metadata_contract.py"
      - "vendor/repository_metadata_contract.provenance.json"
      - "vendor/github_public_resolver.py"
      - "vendor/github_public_resolver.provenance.json"
      - "tests/test_repository_diagnostics.py"
      - "fixtures/benchmark/**"
      - "fixtures/provenance.yaml"
      - ".github/workflows/real-world-pages.yml"
  push:
    branches: [main]
    paths:
      - "scripts/real_world_pages_report.py"
      - "scripts/repository_diagnostics.py"
      - "vendor/repository_metadata_contract.py"
      - "vendor/repository_metadata_contract.provenance.json"
      - "vendor/github_public_resolver.py"
      - "vendor/github_public_resolver.provenance.json"
      - "fixtures/benchmark/**"
      - "fixtures/provenance.yaml"
      - ".github/workflows/real-world-pages.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install pyyaml playwright
          playwright install --with-deps chromium
      - name: Build the report
        # Use the PR head rather than GitHub's synthetic pull-request merge SHA
        # for repository diagnostics. Full history above makes git show reliable.
        env:
          REPOSITORY_DIAGNOSTICS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/real_world_pages_report.py --out _site
          python scripts/repository_diagnostics.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
