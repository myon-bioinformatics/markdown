name: Stdlib runtime compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    # Keep the dependency-free runtime check separate from the pytest environment.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "${{ matrix.python }}"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      # Stdlib unittest, not pytest: this step runs with `python -S` (no
      # site-packages) on Python 3.11-3.14 to prove markdown.py works on a bare
      # interpreter with nothing installed. pytest is an external module, so it
      # cannot run here. All other tests run via `uv run pytest`.
      - name: Exercise runtime behavior without site-packages
        run: python -S -m unittest discover -s tests -p test_runtime_compatibility.py -v
