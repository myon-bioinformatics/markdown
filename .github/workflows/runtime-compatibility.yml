name: Stdlib runtime compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    # setup-python has no Python 3.9 build for Ubuntu 26.04; keep the
    # stdlib-only runtime check on 24.04, separate from pytest (3.11+).
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Stdlib unittest, not pytest: this step runs with `python -S` (no
      # site-packages) on Python 3.9-3.14 to prove markdown.py works on a bare
      # interpreter with nothing installed. pytest is an external module, so it
      # cannot run here. All other tests run via `uv run pytest`.
      - name: Exercise runtime behavior without site-packages
        run: python -S -m unittest discover -s tests -p test_runtime_compatibility.py -v
