# Real Open WebUI, pointed at demos/openai_compat_mock.py instead of a real LLM.
#
# Usage:
#   python demos/openai_compat_mock.py &          # from the repo root, listens on :8090
#   docker compose -f docker/openwebui-smoke/docker-compose.yml up -d
#   # ... open http://127.0.0.1:3000, or run tests/real_chat_ui/test_openwebui_docker.py ...
#   docker compose -f docker/openwebui-smoke/docker-compose.yml down -v
#
# WEBUI_AUTH=False skips Open WebUI's signup/login screen entirely (verified against
# its own source: backend/open_webui/routers/auths.py auto-authenticates a fixed
# admin@localhost account when this is set) -- there is no interactive setup step to
# automate. OPENAI_API_BASE_URLS/OPENAI_API_KEYS pre-register the mock backend as a
# connection at startup, so there's nothing to configure through the admin UI either.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      WEBUI_AUTH: "False"
      WEBUI_NAME: "markdown.py smoke"
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URLS: "http://host.docker.internal:8090/v1"
      OPENAI_API_KEYS: "sk-markdown-demo"
      # Skip the "you have no models" onboarding nag; this mock has exactly one model.
      DEFAULT_MODELS: "markdown-demo-model"
      ENABLE_SIGNUP: "False"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
    extra_hosts:
      # Lets the container reach demos/openai_compat_mock.py running on the host,
      # the same way this works on Docker Desktop -- explicit here for Linux CI runners.
      - "host.docker.internal:host-gateway"
