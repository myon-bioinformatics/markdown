# Fixture provenance and expected construct coverage (human-readable).
# Parsed by tests via PyYAML.

fixtures:
  - id: vscode_readme_snippet
    path: vscode_readme_snippet.md
    source: microsoft/vscode README constructs (representative, offline)
    expect:
      min_headings: 3
      min_images: 1
      min_links: 2
      min_code_blocks: 1
      has_raw_html_tags: [img, video]
      has_horizontal_rule: true

  - id: kubernetes_readme_snippet
    path: kubernetes_readme_snippet.md
    source: kubernetes/kubernetes README constructs (representative, offline)
    expect:
      min_headings: 2
      min_images: 2
      min_links: 2
      min_code_blocks: 1
      has_reference_links: true
      has_raw_html_tags: [p, img]
      has_horizontal_rule: true

unsupported_examples:
  - name: bare_url_autolink
    markdown: |
      Visit https://example.com
    note: Bare URL autolinks are not recognized; only <https://...> angle autolinks and [text](url) links become <a>.

supported_examples:
  - name: gfm_table
    markdown: |
      | a | b |
      | --- | --- |
      | 1 | 2 |
    note: Simple GFM pipe tables (header + | --- | delimiter) render as HTML tables. html_to_markdown() turns simple <table> trees back into this pipe form.
  - name: task_list
    markdown: |
      - [ ] todo
      - [x] done
    note: Unordered -/*/ + task items render as disabled checkbox <input>s; mixed with ordinary bullets in the same <ul>. html_to_markdown() maps <li><input type=checkbox> back to - [ ] / - [x].
  - name: strikethrough
    markdown: |
      ~~mistake~~
    note: ~~text~~ becomes <del>text</del>. Unmatched ~~ stays literal. html_to_markdown() maps <del> back to ~~text~~.
  - name: angle_autolink
    markdown: |
      See <https://example.com>
    note: Angle-bracket http(s) autolinks become <a href>. <script> and other tags stay escaped.
  - name: footnote
    markdown: |
      footnote[^1]

      [^1]: the note
    note: Inline [^id] refs and [^id]: definitions render as superscript links plus a footnotes section. Undefined refs stay literal. Duplicate ids: first definition wins.
  - name: details
    markdown: |
      :::details Summary
      Hidden body
      :::
    note: Zenn-style :::details summary containers render as <details><summary>. Raw HTML <details> in Markdown stays escaped.

# --- Benchmark fixtures (PR: "how far does this get on real Markdown?") ---
#
# Unlike the two "representative, offline" fixtures above, these are real
# excerpts (or, for CHANGELOG, a real truncated prefix) fetched verbatim
# from the pinned commit below, with only GitHub Docs' own Liquid
# templating ({% data ... %}, {% ifversion %}...{% endif %}) stripped from
# prose lines -- never from fenced code content, so embedded examples like
# the nested code fence in "Quoting code" keep their exact indentation.
# fetched_at is when this benchmark was built; re-run the fetch commands
# below and diff against the pinned commit's tree to refresh.
benchmark_fixtures:
  - id: github_docs_markdown
    path: benchmark/github_docs_markdown.md
    source: github/docs (CC-BY-4.0)
    commit: 2320b38e746de554f7f3d2b83520bc0f26485abc
    fetched_at: "2026-09-18"
    sections:
      - {heading: Headings, file: content/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax.md, lines: [17, 31]}
      - {heading: Styling text, file: content/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax.md, lines: [33, 46]}
      - {heading: Quoting text, file: content/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax.md, lines: [48, 63]}
      - {heading: Quoting code, file: content/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax.md, lines: [65, 90]}
      - {heading: Links, file: content/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax.md, lines: [114, 125]}
      - {heading: Creating a table / Formatting content within your table, file: content/get-started/writing-on-github/working-with-advanced-formatting/organizing-information-with-tables.md, lines: [17, 79]}
      - {heading: Lists / Nested Lists, file: content/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax.md, lines: [274, 337]}
      - {heading: Task lists, file: content/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax.md, lines: [338, 346]}
      - {heading: URLs / Issues and pull requests (autolinks), file: content/get-started/writing-on-github/working-with-advanced-formatting/autolinked-references-and-urls.md, lines: [17, 44]}
      - {heading: Footnotes, file: content/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax.md, lines: [401, 420]}
      - {heading: Alerts, file: content/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax.md, lines: [422, 449]}
    fetch_example: |
      curl -sS "https://raw.githubusercontent.com/github/docs/2320b38e746de554f7f3d2b83520bc0f26485abc/content/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax.md"
    covers: [headings, links, images, fenced_code, nested_lists, tables, task_lists, autolinks, alerts, footnotes, inline_html]
    note: >
      GitHub Docs' own Alerts, Quoting text, and Creating a table sections
      are now supported markdown_to_html subsets (uppercase > [!NOTE] etc.
      render as <aside class="markdown-alert">; ordinary > quotes render as
      <blockquote>; the live Style/Syntax pipe table renders as <table>).
      Angle-bracket autolinks, GFM task lists, and ~~strikethrough~~ parse
      as HTML in this engine; this fixture's Task lists / URLs sections
      only show those constructs inside inline code or as bare URLs, so they
      stay literal here. Bare URLs remain unsupported. Footnote markers in
      this fixture live inside a fenced example, so they stay code rather
      than a live footnotes section. Live [^id] / [^id]: forms are supported
      elsewhere (see supported_examples.footnote).
      The five-kind syntax examples inside the Alerts fenced code block stay
      code, not live alerts. The "First Header" table example stays inside a
      fenced code block.

  - id: commonmark_examples
    path: benchmark/commonmark_examples.yaml
    source: commonmark/commonmark-spec, spec.txt, version 0.31.2 (CC-BY-SA 4.0)
    commit: 3da939428d80f146f270cd1765e4ba462e96bb1b
    fetched_at: "2026-09-18"
    fetch_example: |
      curl -sS "https://raw.githubusercontent.com/commonmark/commonmark-spec/3da939428d80f146f270cd1765e4ba462e96bb1b/spec.txt"
    note: >
      13 of the spec's own 655 numbered "example N" blocks, chosen by hand
      to cover headings / emphasis / nested emphasis / escaping /
      blockquote / nested list / fenced code / inline code / horizontal
      rule / links / edge cases. Each entry in the YAML records its
      spec_example number, CommonMark's own expected HTML, this module's
      actual HTML, and a PASS/DEGRADED/UNSUPPORTED/FAIL classification --
      see tests/test_benchmark_commonmark.py.

  - id: contributing_example
    path: benchmark/contributing_example.md
    source: nodejs/node CONTRIBUTING.md (MIT), vendored close to verbatim (small enough not to need excerpting)
    commit: 8566220b359bd2ed8223a30ca37207838431a3dd
    fetched_at: "2026-09-18"
    fetch_example: |
      curl -sS "https://raw.githubusercontent.com/nodejs/node/8566220b359bd2ed8223a30ca37207838431a3dd/CONTRIBUTING.md"
    covers: [headings, links, nested_lists, fenced_code, blockquote_style_tip_callout]

  - id: changelog_example
    path: benchmark/changelog_example.md
    source: axios/axios CHANGELOG.md (MIT), first 400 of 1416 real lines (auto-generated release-notes changelog; truncated for fixture size, not summarized or rewritten)
    commit: 56a5f1acdc41965f464eb59bec6cc828113ba546
    fetched_at: "2026-09-18"
    fetch_example: |
      curl -sS "https://raw.githubusercontent.com/axios/axios/56a5f1acdc41965f464eb59bec6cc828113ba546/CHANGELOG.md" | head -400
    covers: [many_headings, many_links, lists, version_strings, long_input_stability, inline_html_avatars]

  # --- Real-world HTML -> html_to_markdown() fixtures ---
  #
  # Every fixture above feeds markdown_to_html() (Markdown source). These
  # feed the other direction: real HTML from actual sites, not the small
  # synthetic snippet in test_benchmark_html_roundtrip.py (whose own
  # docstring flags that gap -- "not vendored from any specific real page").
  # No git commit exists for a plain website, so provenance is fetched_at +
  # sha256 of the exact vendored bytes instead of a commit SHA.
  - id: tohoho_web_home
    path: benchmark/tohoho_web_home.html
    source: "https://www.tohoho-web.com/ (top page, live site, all rights reserved by its author -- vendored for parser-benchmark purposes only, not redistribution)"
    fetched_at: "2026-09-19"
    sha256: e21b277928c6e06109d3143cabed792391e55d643d9c8d4158b7b1c7eaa55bfc
    fetch_example: |
      curl -sS "https://www.tohoho-web.com/"
    covers: [headings, many_links, nested_semantic_tags_header_aside_main_footer, forms, inline_scripts, japanese_text]
    note: >
      A real, dense Japanese HTML index page (1 <h1>, 24 <h2>, 263 <a href>,
      <header>/<aside>/<main>/<footer> semantic tags, an inline <form>, and
      inline <script> ad-loading blocks) -- see
      tests/test_benchmark_html_roundtrip.py for what survives.
