[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "md-market"
version = "0.0.0"
description = "Stdlib-only Markdown helpers"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "PyYAML>=6.0.3",
  # The shared diagnostics page (web_ui.repository_diagnostics_page); move the pin with: uv lock --upgrade-package pysaiyanweboo
  "pysaiyanweboo @ git+https://github.com/myon-bioinformatics/PySaiyanWeBoo@001727177a4f36d691a615ba36057953b7085b78",
]
frontend-gradio = ["gradio>=6.30.0"]
frontend-streamlit = ["streamlit>=1.66.0"]
frontend-browser = ["playwright>=1.64.0"]
# Backward-compatible full environment for manual/browser workflows.
frontend = [
  { include-group = "frontend-gradio" },
  { include-group = "frontend-streamlit" },
  { include-group = "frontend-browser" },
]

# Installed artifact is the stdlib-only markdown.py. uv manages contributor tools.
[tool.uv]
environments = ["sys_platform != 'emscripten' and python_version >= '3.11'"]
override-dependencies = [
  "pillow>=13.0.0",
  "safehttpx>=0.2.0",
  "tomlkit>=0.15.2",
]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }
frontend = { requires-python = ">=3.11" }
frontend-gradio = { requires-python = ">=3.11" }
frontend-streamlit = { requires-python = ">=3.11" }
frontend-browser = { requires-python = ">=3.11" }

[tool.hatch.build.targets.wheel]
only-include = ["markdown.py"]

[tool.hatch.build.targets.sdist]
only-include = ["markdown.py"]
