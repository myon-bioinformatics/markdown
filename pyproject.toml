[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "md-market"
version = "0.0.0"
description = "Stdlib-only Markdown helpers"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4.2", "PyYAML>=6.0.3"]
frontend = [
  "gradio>=6.30.0",
  "streamlit>=1.66.0",
  "playwright>=1.64.0",
]

# Installed artifact is the stdlib-only markdown.py. uv manages contributor tools.
[tool.uv]
environments = ["sys_platform != 'emscripten' and python_version >= '3.11'"]
override-dependencies = [
  "pillow>=13.0.0",
  "safehttpx>=0.2.0",
  "tomlkit>=0.15.2",
]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }
frontend = { requires-python = ">=3.11" }

[tool.hatch.build.targets.wheel]
only-include = ["markdown.py"]

[tool.hatch.build.targets.sdist]
only-include = ["markdown.py"]
