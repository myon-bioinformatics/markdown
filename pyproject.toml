[project]
name = "markdown-dev"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4.2", "PyYAML>=6.0.3"]
frontend = [
  "gradio>=6.30.0",
  "streamlit>=1.66.0",
  "playwright>=1.64.0",
]

# Vendored/source runtime has no dependencies. uv manages contributor tools only.
[tool.uv]
package = false
environments = ["sys_platform != 'emscripten' and python_version >= '3.11'"]
override-dependencies = ["pillow>=13.0.0"]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }
frontend = { requires-python = ">=3.11" }
